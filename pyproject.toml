[project]
name = "kifbazar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mah2002", email = "n.mahmoodi8001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kifbazar = "kifbazar:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
